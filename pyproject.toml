[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barycon"
dynamic = ["version"]
description = "BaryCon: an open, community-maintained collection of baryon-fraction constraints in galaxy groups and clusters."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT (code); CC-BY-4.0 (compiled data)" }
authors = [
  { name = "Giovanni Aricò", email = "arico@bo.infn.it" },
  { name = "Marian Douspis", email = "marian.douspis@universite-paris-saclay.fr" },
]
keywords = ["cosmology", "galaxy clusters", "baryons", "gas fraction", "stellar fraction", "feedback"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "astropy>=5.0", "pyyaml>=6", "jsonschema>=4", "matplotlib>=3.5"]

[project.optional-dependencies]
colossus = ["colossus>=1.3"]
test = ["pytest>=7", "pytest-cov"]
dev = ["pytest>=7", "pytest-cov", "black>=23", "flake8>=6", "build", "twine"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
barycon = "barycon.cli:main"

[project.urls]
# Canonical host: GitHub (repo renamed from baryon_fractions to barycon at the merge to main)
Homepage = "https://github.com/garico92/barycon"
Repository = "https://github.com/garico92/barycon.git"
Issues = "https://github.com/garico92/barycon/issues"

[tool.setuptools.dynamic]
version = { attr = "barycon._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
barycon = ["data/observations/*", "data/pending/*", "data/references.bib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 110
